# Stack de PB_coach: n8n (orquestador) + pb-coach (API) + garmin-mcp.
# Sin superficie pública: solo n8n publica un puerto, y únicamente en
# 127.0.0.1 del host; al editor se entra con un túnel SSH
# (ssh -L 5678:localhost:5678 usuario@vps). pb-coach y garmin-mcp solo son
# accesibles dentro de la red de Docker. Ver docs/decisions.md.
#
#   docker compose up -d --build                   # n8n + pb-coach
#   docker compose --profile garmin up -d --build  # + garmin-mcp
#   docker compose run --rm --build test           # tests en el contenedor
#
# Requiere un .env con N8N_ENCRYPTION_KEY (ver .env.example).

services:
  n8n:
    image: n8nio/n8n:2.42.3
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY en .env}
      GENERIC_TIMEZONE: ${TZ:-America/Guayaquil}
      TZ: ${TZ:-America/Guayaquil}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # Sin HTTPS: solo se accede por túnel SSH a localhost.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      pb-coach:
        condition: service_healthy
    restart: unless-stopped

  pb-coach:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-America/Guayaquil}
      GARMIN_MCP_URL: http://garmin-mcp:8000/mcp
    volumes:
      - pb-coach-data:/app/data
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    profiles: ["test"]

  # Servidor MCP de Garmin (Taxuspt/garmin_mcp), fijado a un commit.
  # Primer login (pide el código MFA por consola):
  #   docker compose --profile garmin run --rm garmin-mcp
  garmin-mcp:
    build:
      context: https://github.com/Taxuspt/garmin_mcp.git#cfc5d799ab0f165e837f1188a1d093c65838aaf7
    profiles: ["garmin"]
    environment:
      GARMIN_EMAIL_FILE: /run/secrets/garmin_email
      GARMIN_PASSWORD_FILE: /run/secrets/garmin_password
      GARMIN_MCP_TRANSPORT: streamable-http
      GARMIN_MCP_HOST: 0.0.0.0
      GARMIN_MCP_PORT: "8000"
    secrets:
      - garmin_email
      - garmin_password
    volumes:
      - garmin-tokens:/root/.garminconnect
    restart: unless-stopped

secrets:
  garmin_email:
    file: ./secrets/garmin_email.txt
  garmin_password:
    file: ./secrets/garmin_password.txt

volumes:
  n8n-data:
  pb-coach-data:
  garmin-tokens:
